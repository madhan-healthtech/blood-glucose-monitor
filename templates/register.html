<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #1e293b; padding: 40px; border-radius: 16px; width: 400px; }
    h1 { color: white; text-align: center; margin-bottom: 8px; font-size: 22px; }
    p  { color: #94a3b8; text-align: center; margin-bottom: 24px; font-size: 14px; }
    label { color: #94a3b8; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 14px; }
    input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; }
    .btn { width: 100%; margin-top: 20px; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #2563eb; }
    .error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; }
    .link { text-align: center; margin-top: 16px; color: #94a3b8; font-size: 13px; }
    .link a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p>Register as a patient</p>
    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Your Name" required>
      <label>Email</label>
      <input type="email" name="email" placeholder="your@email.com" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Register</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
    <div class="link">Already have an account? <a href="/login">Login</a></div>
  </div>
</body>
</html>
